name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: FiveBallGrandSlam

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            godot: godot
            replay: golden-linux.json
          - os: windows-2022
            godot: C:\Godot\godot.exe
            replay: golden-windows.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.7.1 on Linux
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          sudo install Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install Godot 4.7.1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\Godot | Out-Null
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip -OutFile godot.zip
          Expand-Archive godot.zip C:\Godot -Force
          Move-Item C:\Godot\Godot_v4.7.1-stable_win64.exe C:\Godot\godot.exe -Force
      - name: Import project
        run: ${{ matrix.godot }} --headless --editor --path "${{ github.workspace }}" --quit
      - name: GdUnit4
        run: ${{ matrix.godot }} --path "${{ github.workspace }}" -s -d --headless res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode --add tests/unit
      - name: Prepare replay output
        run: python -c "import os; os.makedirs('replay-output', exist_ok=True)"
      - name: Golden Replay 100-repeat
        run: ${{ matrix.godot }} --headless --path "${{ github.workspace }}" --script res://tools/golden_replay_runner.gd -- --repeat 100 2>&1 | python tools/capture_replay_output.py --output "replay-output/${{ matrix.replay }}"
      - name: Core-loop session replay 100-repeat
        run: ${{ matrix.godot }} --headless --path "${{ github.workspace }}" --script res://tools/core_loop_replay_runner.gd -- --repeat 100 2>&1 | python tools/capture_replay_output.py --output "replay-output/core-${{ matrix.replay }}"
      - name: Physics stress
        run: ${{ matrix.godot }} --headless --path "${{ github.workspace }}" --script res://tools/physics_stress.gd
      - name: Core-loop stress
        run: ${{ matrix.godot }} --headless --path "${{ github.workspace }}" --script res://tools/core_loop_stress.gd
      - name: Technical-table startup smoke
        run: ${{ matrix.godot }} --headless --path "${{ github.workspace }}" --quit-after 2
      - name: Package normalized replay output
        shell: python
        run: |
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          source = root / "replay-output"
          expected = [source / "${{ matrix.replay }}", source / "core-${{ matrix.replay }}"]
          missing = [str(path) for path in expected if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing replay outputs: {missing}; found={list(source.glob('*')) if source.exists() else 'no directory'}")
          archive = root / "replay-${{ runner.os }}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
              for path in expected:
                  output.write(path, path.name)
          print(f"Packaged {archive} ({archive.stat().st_size} bytes)")
      - name: Upload normalized replay output
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ runner.os }}-${{ github.sha }}
          path: replay-${{ runner.os }}.zip
          if-no-files-found: error

  compare-replays:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*-${{ github.sha }}
          path: replay-artifacts
          merge-multiple: true
      - name: Extract replay packages
        run: |
          unzip -o replay-artifacts/replay-Windows.zip -d replay-artifacts/windows
          unzip -o replay-artifacts/replay-Linux.zip -d replay-artifacts/linux
      - name: Compare Windows and Linux normalized results
        run: |
          python tools/compare_platform_replays.py replay-artifacts/windows/golden-windows.json replay-artifacts/linux/golden-linux.json replay-diff.json
          python tools/compare_platform_replays.py replay-artifacts/windows/core-golden-windows.json replay-artifacts/linux/core-golden-linux.json core-replay-diff.json
      - name: Upload cross-platform diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-cross-platform-${{ github.sha }}
          path: |
            replay-diff.json
            core-replay-diff.json
          if-no-files-found: error

  export:
    needs: compare-replays
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    strategy:
      fail-fast: false
      matrix:
        target:
          - preset: Windows Desktop
            dir: windows
            file: FiveBallGrandSlam.exe
          - preset: Linux/X11
            dir: linux
            file: FiveBallGrandSlam.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -s /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export ${{ matrix.target.preset }}
        run: |
          mkdir -p builds/${{ matrix.target.dir }}
          godot --headless --path . --export-release "${{ matrix.target.preset }}" "builds/${{ matrix.target.dir }}/${{ matrix.target.file }}"
      - name: Smoke Linux export
        if: matrix.target.dir == 'linux'
        run: chmod +x builds/linux/FiveBallGrandSlam.x86_64 && builds/linux/FiveBallGrandSlam.x86_64 --headless --quit-after 2
      - name: Upload ${{ matrix.target.dir }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2-${{ matrix.target.dir }}-${{ github.sha }}
          path: builds/${{ matrix.target.dir }}/
          if-no-files-found: error

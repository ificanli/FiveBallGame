name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: FiveBallGrandSlam

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: GdUnit4
        run: godot --path . -s -d --headless res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode --add tests/unit
      - name: Golden Replay contract
        run: godot --headless --path . --script res://tools/golden_replay_smoke.gd
      - name: Project startup smoke
        run: godot --headless --path . --quit-after 2

  export:
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    strategy:
      fail-fast: false
      matrix:
        target:
          - preset: Windows Desktop
            dir: windows
            file: FiveBallGrandSlam.exe
          - preset: Linux/X11
            dir: linux
            file: FiveBallGrandSlam.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -s /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export ${{ matrix.target.preset }}
        run: |
          mkdir -p builds/${{ matrix.target.dir }}
          godot --headless --path . --export-release "${{ matrix.target.preset }}" "builds/${{ matrix.target.dir }}/${{ matrix.target.file }}"
      - name: Upload ${{ matrix.target.dir }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: m0-${{ matrix.target.dir }}-${{ github.sha }}
          path: builds/${{ matrix.target.dir }}/
          if-no-files-found: error
